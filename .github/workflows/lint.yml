name : Liniting and Formatting on PR
on:
  pull_request:
    branches:
      - "**"


jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' 

      - name: Cd into backend
        run: cd ../../backend

      - name: Install Dependencies
        run: bun install
        
      - name: Generate Prisma Client
        run: bun --bunx prisma generate  

      - name: Run Build
        run:  bun run build

    
